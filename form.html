<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오래된 서랍 - 북 큐레이션 신청</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2018; /* PC 배경색: 고급스러운 어두운 브라운 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        .phone-frame {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #f5f1ea;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
            border: none;
            display: block;
        }
        @media (max-width: 480px) {
            .phone-frame {
                max-width: 100%;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <iframe src="/form_content" class="phone-frame" title="Curation Application Form"></iframe>
</body>
</html>
