        document.addEventListener('DOMContentLoaded', () => {
            
            
            document.getElementById('header-title').textContent = bookData.title;
            document.getElementById('hero-title').textContent = bookData.title;
            document.getElementById('hero-subtitle').textContent = bookData.subtitle;
            document.getElementById('hero-author').textContent = bookData.author;
            document.getElementById('hero-original-price').textContent = bookData.original_price;
            document.getElementById('hero-price').textContent = bookData.price;
            document.getElementById('book-condition').textContent = bookData.condition;
            document.getElementById('hero-shipping').textContent = bookData.shipping_fee;
            document.getElementById('hero-cover').src = bookData.cover_image;

            
            const tabs = [
                { id: 'intro', label: '책 소개', content: bookData.description },
                { id: 'toc', label: '목차', content: bookData.table_of_contents },
                { id: 'author', label: '저자 소개', content: bookData.author_intro },
                { id: 'specs', label: '도서 정보', content: bookData.book_meta_info },
                { id: 'guide', label: '구매 안내', content: `
                    <div class="space-y-6 font-sans text-sm">
                        <div>
                            <h6 class="font-bold text-charcoal mb-2 flex items-center gap-2"><div class="w-1 h-1 bg-charcoal rounded-full"></div>결제 정보</h6>
                            <p class="text-gray-600 leading-relaxed pl-3">${bookData.purchase_guide.payment}</p>
                        </div>
                        <div>
                            <h6 class="font-bold text-charcoal mb-2 flex items-center gap-2"><div class="w-1 h-1 bg-charcoal rounded-full"></div>배송 정보</h6>
                            <p class="text-gray-600 leading-relaxed pl-3">${bookData.purchase_guide.shipping}</p>
                        </div>
                        <div>
                            <h6 class="font-bold text-charcoal mb-2 flex items-center gap-2"><div class="w-1 h-1 bg-charcoal rounded-full"></div>교환 및 반품</h6>
                            <p class="text-gray-600 leading-relaxed pl-3">${bookData.purchase_guide.return_refund}</p>
                        </div>
                    </div>` 
                }
            ];

            const tabsNav = document.getElementById('tabs-nav');
            const tabContent = document.getElementById('tab-content');

            
            tabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn flex-1 min-w-fit px-4 py-3.5 text-[14px] font-medium whitespace-nowrap transition-colors relative
                                ${index === 0 ? 'text-charcoal' : 'text-gray-400'}`;
                btn.textContent = tab.label;
                btn.dataset.target = tab.id;
                
                
                const indicator = document.createElement('div');
                indicator.className = `tab-indicator absolute bottom-0 left-0 w-full h-[2px] bg-charcoal transition-opacity duration-300
                                     ${index === 0 ? 'opacity-100' : 'opacity-0'}`;
                btn.appendChild(indicator);

                btn.addEventListener('click', () => switchTab(tab, btn));
                tabsNav.appendChild(btn);
            });

            
            tabContent.innerHTML = `<div class="fade-in">${tabs[0].content}</div>`;

            function switchTab(tabData, clickedBtn) {
                
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('text-charcoal');
                    b.classList.add('text-gray-400');
                    b.querySelector('.tab-indicator').classList.replace('opacity-100', 'opacity-0');
                });
                clickedBtn.classList.remove('text-gray-400');
                clickedBtn.classList.add('text-charcoal');
                clickedBtn.querySelector('.tab-indicator').classList.replace('opacity-0', 'opacity-100');

                
                tabContent.innerHTML = `<div class="fade-in">${tabData.content}</div>`;
                
                
                const tabsTop = tabsNav.parentElement.getBoundingClientRect().top;
                if(tabsTop < 0) {
                    window.scrollTo({ top: window.scrollY + tabsTop - 60, behavior: 'smooth' });
                }
            }

            
            const reviewsContainer = document.getElementById('reviews-container');
            reviewsData.forEach(review => {
                const starsHtml = Array(5).fill(0).map((_, i) => 
                    `<svg class="w-3.5 h-3.5 ${i < review.rating ? 'text-charcoal fill-current' : 'text-gray-300 fill-current'}" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`
                ).join('');

                const card = document.createElement('div');
                card.className = 'snap-center flex-shrink-0 w-[280px] bg-white border border-borderLight rounded-2xl p-5 shadow-sm flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex gap-0.5 mb-3">${starsHtml}</div>
                        <p class="font-sans text-[14px] leading-relaxed text-charcoal mb-4 line-clamp-4">"${review.text}"</p>
                    </div>
                    <div class="text-[11px] text-muted font-medium tracking-wide flex items-center justify-between">
                        <span>${review.user}</span>
                        <span class="text-gray-300 px-2 py-1 bg-gray-50 rounded-md">Verified</span>
                    </div>
                `;
                reviewsContainer.appendChild(card);
            });

            
            const qaContainer = document.getElementById('qa-container');
            qaData.forEach((qa, index) => {
                const item = document.createElement('div');
                item.className = 'border-b border-borderLight';
                item.innerHTML = `
                    <button class="w-full py-5 flex items-center justify-between text-left focus:outline-none group">
                        <span class="font-medium text-[15px] pr-4 group-hover:text-black transition-colors">${qa.q}</span>
                        <svg class="w-5 h-5 text-gray-400 transform transition-transform duration-300 chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="accordion-content text-[14px] text-gray-600 leading-relaxed bg-surface/50 rounded-b-lg">
                        <div class="accordion-inner px-4 pb-5 pt-1">
                            ${qa.a}
                        </div>
                    </div>
                `;
                
                const btn = item.querySelector('button');
                btn.addEventListener('click', () => {
                    const content = item.querySelector('.accordion-content');
                    const chevron = item.querySelector('.chevron');
                    const isOpen = content.classList.contains('is-open');
                    
                    
                    document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('is-open'));
                    document.querySelectorAll('.chevron').forEach(c => c.classList.remove('rotate-180'));

                    if (!isOpen) {
                        content.classList.add('is-open');
                        chevron.classList.add('rotate-180');
                    }
                });
                
                qaContainer.appendChild(item);
            });

            
            const btnWishlist = document.getElementById('btn-wishlist');
            const iconHeart = document.getElementById('icon-heart');
            let isWishlisted = false;

            btnWishlist.addEventListener('click', () => {
                isWishlisted = !isWishlisted;
                if (isWishlisted) {
                    iconHeart.setAttribute('fill', 'currentColor');
                    iconHeart.classList.add('text-red-500');
                    
                    iconHeart.style.transform = 'scale(1.2)';
                    setTimeout(() => iconHeart.style.transform = 'scale(1)', 150);
                } else {
                    iconHeart.setAttribute('fill', 'none');
                    iconHeart.classList.remove('text-red-500');
                }
                iconHeart.style.transition = 'transform 0.15s ease, color 0.2s ease';
            });

            
            const topBar = document.getElementById('top-bar');
            const headerTitle = document.getElementById('header-title');
            const heroTitle = document.getElementById('hero-title');

            window.addEventListener('scroll', () => {
                const heroTitleRect = heroTitle.getBoundingClientRect();
                
                
                if (heroTitleRect.bottom < 60) { 
                    headerTitle.classList.remove('opacity-0', 'translate-y-1');
                    headerTitle.classList.add('opacity-100', 'translate-y-0');
                    topBar.classList.replace('border-transparent', 'border-borderLight');
                    topBar.classList.add('shadow-header');
                } else {
                    headerTitle.classList.add('opacity-0', 'translate-y-1');
                    headerTitle.classList.remove('opacity-100', 'translate-y-0');
                    topBar.classList.replace('border-borderLight', 'border-transparent');
                    topBar.classList.remove('shadow-header');
                }
            }, { passive: true });

        });
    </script>

</body></html>
