    <script vid="99">
        document.addEventListener('DOMContentLoaded', () => {
            
            
            document.getElementById('header-title').textContent = bookData.title;
            document.getElementById('cover-img').src = bookData.cover_image;
            document.getElementById('cover-img').alt = `${bookData.title} cover`;
            document.getElementById('book-title').textContent = bookData.title;
            document.getElementById('book-subtitle').textContent = bookData.subtitle;
            document.getElementById('book-author').textContent = bookData.author;
            document.getElementById('book-price').textContent = bookData.price.toLocaleString('ko-KR');
            document.getElementById('book-shipping').textContent = `배송비: ${bookData.shipping_fee}`;

            
            document.getElementById('content-intro').innerHTML = bookData.description;
            document.getElementById('content-toc').innerHTML = bookData.table_of_contents;
            document.getElementById('content-author').textContent = bookData.author_intro;

            
            const specsContainer = document.getElementById('content-specs');
            bookData.book_meta_info.forEach(info => {
                const row = document.createElement('div');
                row.className = 'flex py-4 border-b border-border/50 text-sm';
                row.innerHTML = `
                    <div class="w-24 flex-shrink-0 text-muted font-medium">${info.label}</div>
                    <div class="text-charcoal font-light">${info.value}</div>
                `;
                specsContainer.appendChild(row);
            });

            
            document.getElementById('guide-payment').textContent = bookData.purchase_guide.payment;
            document.getElementById('guide-shipping').textContent = bookData.purchase_guide.shipping;
            document.getElementById('guide-refund').textContent = bookData.purchase_guide.return_refund;

            
            const reviewContainer = document.getElementById('review-carousel');
            bookData.reviews.forEach(review => {
                const stars = Array(5).fill(0).map((_, i) => 
                    i < review.rating ? '<i class="ph-fill ph-star text-[#1A1A1A]"></i>' : '<i class="ph ph-star text-[#EAE6DF]"></i>'
                ).join('');

                const card = document.createElement('div');
                card.className = 'snap-start flex-shrink-0 w-[280px] sm:w-[320px] bg-white border border-border p-5 rounded-xl shadow-sm flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex text-sm mb-3 gap-0.5">${stars}</div>
                        <p class="font-sans text-[13px] leading-relaxed text-charcoal/90 font-light line-clamp-3">"${review.text}"</p>
                    </div>
                    <div class="mt-4 pt-4 border-t border-border/50 flex justify-between items-center text-[11px] text-muted">
                        <span>${review.user}</span>
                        <span>${review.date}</span>
                    </div>
                `;
                reviewContainer.appendChild(card);
            });

            
            const qaContainer = document.getElementById('qa-container');
            bookData.qa.forEach((qa, index) => {
                const item = document.createElement('div');
                item.className = 'border-b border-border group';
                item.innerHTML = `
                    <button class="w-full py-5 flex items-center justify-between text-left focus:outline-none qa-btn" aria-expanded="false">
                        <span class="font-sans text-[15px] font-medium text-charcoal pr-4">
                            <span class="text-charcoal/40 font-serif mr-2">Q.</span>${qa.q}
                        </span>
                        <i class="ph ph-caret-down text-muted transition-transform duration-300 transform qa-icon"></i>
                    </button>
                    <div class="accordion-content bg-gray-50/50 px-4 rounded-b-lg">
                        <p class="py-5 text-sm leading-relaxed text-charcoal/80 font-light">
                            <span class="text-charcoal/40 font-serif mr-2 font-medium">A.</span>${qa.a}
                        </p>
                    </div>
                `;
                qaContainer.appendChild(item);
            });


            

            
            const topBar = document.getElementById('top-bar');
            const headerTitle = document.getElementById('header-title');
            const heroTitle = document.getElementById('book-title');

            window.addEventListener('scroll', () => {
                const heroRect = heroTitle.getBoundingClientRect();
                
                if (heroRect.bottom < 50) {
                    headerTitle.classList.remove('opacity-0');
                    headerTitle.classList.add('opacity-100');
                    topBar.classList.add('shadow-sm');
                } else {
                    headerTitle.classList.remove('opacity-100');
                    headerTitle.classList.add('opacity-0');
                    topBar.classList.remove('shadow-sm');
                }
            });

            
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    
                    tabBtns.forEach(b => {
                        b.classList.remove('tab-active');
                        b.classList.add('tab-inactive');
                    });
                    tabContents.forEach(c => {
                        c.classList.add('hidden');
                        c.classList.remove('block');
                    });

                    
                    btn.classList.add('tab-active');
                    btn.classList.remove('tab-inactive');
                    const targetId = btn.getAttribute('data-target');
                    document.getElementById(targetId).classList.remove('hidden');
                    document.getElementById(targetId).classList.add('block');

                    
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                });
            });

            
            const qaBtns = document.querySelectorAll('.qa-btn');
            qaBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const expanded = this.getAttribute('aria-expanded') === 'true' || false;
                    const content = this.nextElementSibling;
                    const icon = this.querySelector('.qa-icon');

                    
                    

                    this.setAttribute('aria-expanded', !expanded);
                    icon.classList.toggle('rotate-180');
                    
                    if (!expanded) {
                        content.classList.add('open');
                        content.style.maxHeight = content.scrollHeight + "px";
                    } else {
                        content.classList.remove('open');
                        content.style.maxHeight = null;
                    }
                });
            });

            
            const wishlistBtn = document.getElementById('wishlist-btn');
            const wishlistIcon = wishlistBtn.querySelector('i');
            let isWishlisted = false;

            wishlistBtn.addEventListener('click', () => {
                isWishlisted = !isWishlisted;
                if(isWishlisted) {
                    wishlistIcon.classList.remove('ph-heart');
                    wishlistIcon.classList.add('ph-fill', 'ph-heart', 'text-red-500');
                    wishlistBtn.classList.add('border-red-500/30', 'bg-red-50');
                } else {
                    wishlistIcon.classList.add('ph-heart');
                    wishlistIcon.classList.remove('ph-fill', 'ph-heart', 'text-red-500');
                    wishlistBtn.classList.remove('border-red-500/30', 'bg-red-50');
                }
                
                
                wishlistIcon.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    wishlistIcon.style.transform = 'scale(1)';
                }, 150);
            });
        });
    </script>

</body></html>
